<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>daymark . · sparkle badge motion preview</title>
<style>
  :root {
    --navy: #243B71;
    --lav-1: #CFDAFF;
    --lav-2: #C4D2FF;
    --lav-3: #AFC0F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #F6F7FB;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  }

  /* ---- the card, matching MomentumCard.kt ---- */
  .card {
    width: 372px;
    border-radius: 24px;
    padding: 20px;
    background: linear-gradient(120deg, var(--lav-1), var(--lav-2) 55%, var(--lav-3));
  }
  .top { display: flex; align-items: flex-start; }
  .copy { flex: 1; min-width: 0; }
  .eyebrow {
    margin: 0 0 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: rgba(36, 59, 113, 0.65);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    line-height: 29px;
    letter-spacing: -0.4px;
    font-weight: 700;
    color: var(--navy);
  }
  .sub { margin: 0; font-size: 13px; line-height: 18px; color: rgba(36, 59, 113, 0.72); }

  /* ---- the badge ---- */
  .badge {
    position: relative;
    flex: none;
    width: 44px;
    height: 44px;
    margin-left: 12px;
    border-radius: 50%;
    border: 1px solid rgba(36, 59, 113, 0.22);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .halo {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--navy) 0%, rgba(36, 59, 113, 0) 70%);
    animation: halo 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
  }
  .star {
    position: relative;
    width: 20px;
    height: 20px;
    animation: breathe 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    transform-origin: center;
  }
  .star svg { display: block; width: 100%; height: 100%; }

  /* ---- progress row ---- */
  .meter { display: flex; align-items: center; margin-top: 18px; }
  .track {
    flex: 1;
    height: 6px;
    border-radius: 99px;
    background: rgba(36, 59, 113, 0.20);
    overflow: hidden;
  }
  .fill { height: 100%; width: 50%; border-radius: 99px; background: var(--navy); }
  .pct {
    width: 38px;
    margin-left: 12px;
    text-align: right;
    font-size: 12px;
    font-weight: 700;
    color: var(--navy);
  }

  /* ---- the two keyframes that matter ---- */
  @keyframes breathe {
    from { transform: scale(0.94) rotate(-9deg); opacity: 0.78; }
    to   { transform: scale(1.06) rotate(9deg);  opacity: 1; }
  }
  @keyframes halo {
    from { transform: scale(0.80); opacity: 0.14; }
    to   { transform: scale(1.20); opacity: 0.04; }
  }

  /* completion pop: 1 -> 1.24 in 160ms, then a soft 0.55-damped spring back */
  .pop { animation: pop 620ms cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes pop {
    0%   { transform: scale(1); }
    26%  { transform: scale(1.24); }
    100% { transform: scale(1); }
  }

  /* accessibility: Remove animations */
  body.still .halo, body.still .star { animation: none; }
  body.still .halo { opacity: 0.10; }
  body.still .star { opacity: 1; transform: none; }

  .controls {
    margin-top: 28px;
    display: flex;
    gap: 10px;
    justify-content: center;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  }
  button {
    border: 1px solid #d3d8e6;
    background: #fff;
    color: #24304a;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: #aab4cc; }
  .note {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: #6b768f;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div>
    <div class="card">
      <div class="top">
        <div class="copy">
          <p class="eyebrow">YOUR DAILY MOMENTUM</p>
          <h1>1 little step to go.</h1>
          <p class="sub">1 of 2 tasks complete. You've got this.</p>
        </div>
        <div class="badge" id="badge">
          <div class="halo"></div>
          <div class="star">
            <svg viewBox="0 0 24 24" fill="#243B71" aria-hidden="true">
              <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="meter">
        <div class="track"><div class="fill"></div></div>
        <div class="pct">50%</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="replay()">Fire completion pop</button>
      <button onclick="document.body.classList.toggle('still')">Toggle “Remove animations”</button>
    </div>
    <p class="note">
      1.6 s breathe, reversed forever · scale 0.94–1.06 · roll −9°–9° · alpha 0.78–1.0<br>
      Same timings and curve as <code>SparkleBadge</code> in <code>MomentumCard.kt</code>.
    </p>
  </div>

<script>
  const badge = document.getElementById('badge');
  function replay() {
    badge.classList.remove('pop');
    void badge.offsetWidth;          // force reflow so the animation restarts
    badge.classList.add('pop');
  }
</script>
</body>
</html>
